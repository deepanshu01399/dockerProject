# version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=qwerty

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=qwerty
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_URL=mongodb://admin:qwerty@mongo:27017
    depends_on:
      - mongo

  backend:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    # environment:
    #     - MONGO_URI=mongodb://admin:qwerty@mongo:27017/mydatabase
        # - MONGO_URI=mongodb://mongo:27017/mydatabase
    depends_on:
      - mongo

  frontend:
    build: ../my-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend  

volumes:
  mongo_data:
